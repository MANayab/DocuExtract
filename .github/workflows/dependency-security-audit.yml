name: Dependency security audit
on:
  push:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit committed dependency tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - name: Record toolchain
        run: |
          node --version
          npm --version
      - name: Install committed dependency tree
        run: npm ci
      - name: Audit committed lockfile
        id: audit
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit.json
          audit_status=$?
          set -e
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          const counts = report.metadata?.vulnerabilities ?? {};
          console.log('npm audit severity totals:');
          for (const severity of ['info', 'low', 'moderate', 'high', 'critical', 'total']) {
            console.log(`  ${severity}: ${counts[severity] ?? 0}`);
          }
          NODE
          echo "exit_code=$audit_status" >> "$GITHUB_OUTPUT"
          echo "npm audit exit code: $audit_status"
      - name: Upload raw committed-lockfile audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-audit
          path: npm-audit.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Enforce clean audit
        if: steps.audit.outcome == 'success'
        env:
          AUDIT_EXIT_CODE: ${{ steps.audit.outputs.exit_code }}
        run: |
          test "$AUDIT_EXIT_CODE" = "0"
