name: Temporary pinned Prettier output
on:
  push:
    branches:
      - precommercial/v1.6.0-baseline
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: precommercial/v1.6.0-baseline
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Capture before and after formatter output
        run: |
          mkdir -p /tmp/prettier-before /tmp/prettier-after
          cp e2e/ocr-assets.spec.ts vite.config.ts /tmp/prettier-before/
          npx prettier --write e2e/ocr-assets.spec.ts vite.config.ts
          cp e2e/ocr-assets.spec.ts vite.config.ts /tmp/prettier-after/
          diff -u /tmp/prettier-before/ocr-assets.spec.ts /tmp/prettier-after/ocr-assets.spec.ts > /tmp/ocr-assets.diff || true
          diff -u /tmp/prettier-before/vite.config.ts /tmp/prettier-after/vite.config.ts > /tmp/vite-config.diff || true
      - uses: actions/upload-artifact@v4
        with:
          name: formatter-diff-and-output
          path: |
            /tmp/prettier-before/
            /tmp/prettier-after/
            /tmp/ocr-assets.diff
            /tmp/vite-config.diff
          retention-days: 1
