name: Temporary v1.6.1 formatter

on:
  push:
    branches:
      - fix/v1.6.1-pwa-polish

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v1.6.1-pwa-polish
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prettier --write e2e/pwa.spec.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/pwa.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format PWA acceptance test"
            git push origin HEAD:fix/v1.6.1-pwa-polish
          fi
