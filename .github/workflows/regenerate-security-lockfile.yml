name: Regenerate security toolchain lockfile

on:
  push:
    branches: [security/remediate-toolchain-2026-11]

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - name: Regenerate with npm
        run: |
          npm install
          git diff -- package-lock.json
      - name: Prove clean install
        run: |
          rm -rf node_modules
          npm ci
          npm ls --all
      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already matches package.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(security): regenerate committed dependency lockfile"
          git push
