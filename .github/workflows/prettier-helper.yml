name: Temporary Prettier formatting helper

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/prettier-helper.yml'

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Format changed PWA files with the pinned repository Prettier
        run: npx prettier --write e2e/pwa.spec.ts public/sw.js vite.config.ts
      - uses: actions/upload-artifact@v4
        with:
          name: prettier-formatted-pwa-sources
          path: |
            e2e/pwa.spec.ts
            public/sw.js
            vite.config.ts
          if-no-files-found: error
