name: Temporary pinned Prettier output
on:
  push:
    branches:
      - precommercial/v1.6.0-baseline
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: precommercial/v1.6.0-baseline
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prettier --write e2e/pwa-update.spec.ts e2e/pwa.spec.ts e2e/ocr-assets.spec.ts e2e/privacy.spec.ts
      - uses: actions/upload-artifact@v4
        with:
          name: final-prettier-e2e
          path: |
            e2e/pwa-update.spec.ts
            e2e/pwa.spec.ts
            e2e/ocr-assets.spec.ts
            e2e/privacy.spec.ts
          retention-days: 1
