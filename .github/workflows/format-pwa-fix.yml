name: Format PWA fix files

on:
  push:
    branches: [fix/pwa-cache-cleanup-after-tab-close]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
      - run: npm ci
      - run: npx prettier --write public/sw.js
      - run: |
          if git diff --quiet -- public/sw.js; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/sw.js
          git commit -m "style(pwa): format service worker"
          git push
