<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-label="Animated pipeline: invoice PDF is parsed in the browser and exported as XLSX, CSV or JSON" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .bg{fill:#F2EEE3}
    .ink{stroke:#1C1B19;stroke-width:2;fill:#FBF9F3}
    .mono{font-family:'DejaVu Sans Mono',Menlo,Consolas,monospace;font-size:13px;fill:#1C1B19}
    .mute{fill:#5A564C}
    .bar{fill:#CFC8B6}
    .hit{fill:#F0B9A7}
    .wire{stroke:#1C1B19;stroke-width:2;stroke-dasharray:6 6;fill:none;animation:dash 1.2s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-24}}
    .scan{animation:scan 3.2s ease-in-out infinite}
    @keyframes scan{0%{transform:translateY(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(112px);opacity:0}}
    .cell{opacity:0;animation:fill 3.2s steps(1,end) infinite}
    .c1{animation-delay:1.6s}.c2{animation-delay:1.9s}.c3{animation-delay:2.2s}.c4{animation-delay:2.5s}
    @keyframes fill{0%{opacity:0}1%{opacity:1}92%{opacity:1}100%{opacity:0}}
    .tag{animation:blink 3.2s steps(1,end) infinite}
    @keyframes blink{0%,40%{fill:#5A564C}41%,100%{fill:#C8431F}}
    @media (prefers-reduced-motion:reduce){.wire,.scan,.cell,.tag{animation:none}.cell{opacity:1}}
  </style>
  <rect class="bg" width="900" height="220"/>
  <!-- PDF -->
  <g transform="translate(40,30)">
    <rect x="6" y="6" width="130" height="150" fill="#1C1B19"/>
    <rect class="ink" width="130" height="150"/>
    <text class="mono" x="12" y="22" font-weight="700">INVOICE</text>
    <rect class="hit" x="12" y="36" width="70" height="6"/>
    <rect class="bar" x="12" y="50" width="46" height="6"/>
    <rect class="bar" x="12" y="72" width="60" height="6"/><rect class="hit" x="90" y="72" width="26" height="6"/>
    <rect class="bar" x="12" y="88" width="60" height="6"/><rect class="bar" x="90" y="88" width="26" height="6"/>
    <rect class="bar" x="12" y="104" width="60" height="6"/><rect class="hit" x="90" y="104" width="26" height="6"/>
    <rect class="scan" x="0" y="30" width="130" height="3" fill="#C8431F"/>
    <text class="mono mute" x="65" y="178" text-anchor="middle">input.pdf</text>
  </g>
  <path class="wire" d="M190 105 H290"/>
  <!-- Parser -->
  <g transform="translate(300,55)">
    <rect x="5" y="5" width="130" height="100" fill="#1C1B19"/>
    <rect class="ink" width="130" height="100"/>
    <text class="mono" x="65" y="30" text-anchor="middle" font-weight="700">browser</text>
    <text class="mono mute" x="65" y="52" text-anchor="middle">pdf.js</text>
    <text class="mono mute" x="65" y="70" text-anchor="middle">heuristics</text>
    <text class="mono tag" x="65" y="90" text-anchor="middle">no upload</text>
  </g>
  <path class="wire" d="M440 105 H540"/>
  <!-- XLSX -->
  <g transform="translate(550,30)">
    <rect x="6" y="6" width="150" height="150" fill="#1F6B45"/>
    <rect x="0" y="0" width="150" height="150" fill="#fff" stroke="#1F6B45" stroke-width="2"/>
    <rect width="150" height="26" fill="#DCEBDF"/>
    <g class="mono" font-size="12" fill="#1F6B45" font-weight="700"><text x="12" y="17">SKU</text><text x="62" y="17">Qty</text><text x="102" y="17">Amt</text></g>
    <g stroke="#BFD6C6"><path d="M0 52H150M0 78H150M0 104H150M0 130H150M50 0V150M96 0V150"/></g>
    <g class="mono" font-size="12">
      <g class="cell c1"><text x="12" y="44">A-12</text><text x="62" y="44">4</text><text x="102" y="44">240</text></g>
      <g class="cell c2"><text x="12" y="70">B-07</text><text x="62" y="70">10</text><text x="102" y="70">980</text></g>
      <g class="cell c3"><text x="12" y="96">C-31</text><text x="62" y="96">2</text><text x="102" y="96">410</text></g>
      <g class="cell c4"><text x="62" y="122" font-weight="700">SUM</text><text x="102" y="122" font-weight="700" fill="#C8431F">4,820</text></g>
    </g>
    <text class="mono mute" x="75" y="178" text-anchor="middle">output.xlsx</text>
  </g>
  <!-- formats -->
  <g class="mono" font-size="13">
    <rect x="740" y="60" width="120" height="30" fill="#FBF9F3" stroke="#1C1B19" stroke-width="2"/><text x="800" y="80" text-anchor="middle">.xlsx</text>
    <rect x="740" y="100" width="120" height="30" fill="#FBF9F3" stroke="#1C1B19" stroke-width="2"/><text x="800" y="120" text-anchor="middle">.csv</text>
    <rect x="740" y="140" width="120" height="30" fill="#FBF9F3" stroke="#1C1B19" stroke-width="2"/><text x="800" y="160" text-anchor="middle">.json</text>
  </g>
  <path class="wire" d="M710 105 H735"/>
</svg>
