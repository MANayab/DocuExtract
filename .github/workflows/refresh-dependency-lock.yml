name: Refresh dependency lockfile
on:
  push:
    branches:
      - chore/dependency-security-audit

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply non-breaking npm audit fixes to lockfile only
        run: npm audit fix --package-lock-only --ignore-scripts
      - name: Upload regenerated lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audited-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 3
