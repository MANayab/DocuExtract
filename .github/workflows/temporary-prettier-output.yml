name: Temporary pinned Prettier output
on:
  push:
    branches:
      - precommercial/v1.6.0-baseline
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: precommercial/v1.6.0-baseline
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: >-
          npx prettier --write
          vite.config.ts
          src/features/pwa/register.ts
          src/content/site.ts
          e2e/smoke.spec.ts
          e2e/locale-layout.spec.ts
          e2e/pwa-update.spec.ts
          e2e/pwa.spec.ts
          e2e/ocr-assets.spec.ts
          e2e/privacy.spec.ts
      - name: Commit pinned Prettier output to the PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vite.config.ts src/features/pwa/register.ts src/content/site.ts e2e/smoke.spec.ts e2e/locale-layout.spec.ts e2e/pwa-update.spec.ts e2e/pwa.spec.ts e2e/ocr-assets.spec.ts e2e/privacy.spec.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: apply pinned Prettier formatting"
            git push origin HEAD:precommercial/v1.6.0-baseline
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: final-prettier-status-selectors
          path: |
            vite.config.ts
            src/features/pwa/register.ts
            src/content/site.ts
            e2e/smoke.spec.ts
            e2e/locale-layout.spec.ts
            e2e/pwa-update.spec.ts
            e2e/pwa.spec.ts
            e2e/ocr-assets.spec.ts
            e2e/privacy.spec.ts
          retention-days: 1
