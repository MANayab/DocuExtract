name: Format OCR test

on:
  push:
    branches: [feat/v1.4.0-ocr-languages-2]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v1.4.0-ocr-languages-2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/tests/unit/ocrEngine.test.ts
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tests/unit/ocrEngine.test.ts
          git commit -m "style: format OCR lifecycle test"
          git push
