name: Temporary pinned Prettier output
on:
  push:
    branches:
      - precommercial/v1.6.0-baseline
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: precommercial/v1.6.0-baseline
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Format implementation and browser acceptance tests
        run: >-
          npx prettier --write
          index.html
          public/sw.js
          vite.config.ts
          src/features/pwa/register.ts
          src/features/ocr/ocrEngine.ts
          src/features/templates/templateMatcher.ts
          src/tests/unit/seo.test.ts
          src/tests/unit/templateStore.test.ts
          scripts/prepare-pwa-test-builds.mjs
          scripts/pwa-test-server.mjs
          e2e/pwa-update.spec.ts
          e2e/pwa.spec.ts
          e2e/ocr-assets.spec.ts
          e2e/privacy.spec.ts
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-prettier-final-code
          path: |
            index.html
            public/sw.js
            vite.config.ts
            src/features/pwa/register.ts
            src/features/ocr/ocrEngine.ts
            src/features/templates/templateMatcher.ts
            src/tests/unit/seo.test.ts
            src/tests/unit/templateStore.test.ts
            scripts/prepare-pwa-test-builds.mjs
            scripts/pwa-test-server.mjs
            e2e/pwa-update.spec.ts
            e2e/pwa.spec.ts
            e2e/ocr-assets.spec.ts
            e2e/privacy.spec.ts
          retention-days: 1
