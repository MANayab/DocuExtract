name: Refresh dependency lockfile
on:
  push:
    branches:
      - chore/dependency-security-audit

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply non-breaking npm audit fixes to lockfile only
        shell: bash
        run: |
          set +e
          npm audit fix --package-lock-only --ignore-scripts
          audit_fix_status=$?
          set -e
          echo "npm audit fix exit code: ${audit_fix_status}; unresolved advisories requiring breaking changes remain documented."
      - name: Commit lockfile changes on this feature branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit."
          else
            git commit -m "chore(deps): apply safe lockfile audit fixes"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
