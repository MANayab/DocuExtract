name: Dependency security audit
on:
  push:
    branches:
      - chore/dependency-security-audit
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Non-mutating npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Generate complete dependency audit report
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit.json
          audit_status=$?
          set -e
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const audit = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const rows = [];
          const collectAdvisories = (name, seen = new Set()) => {
            if (seen.has(name)) return [];
            seen.add(name);
            const entry = audit.vulnerabilities?.[name];
            if (!entry) return [];
            return (entry.via ?? []).flatMap(v => {
              if (typeof v === 'object') return [`${v.title ?? v.name ?? 'Advisory title unavailable'} (${v.url ?? 'no advisory URL'})`];
              if (typeof v === 'string') return collectAdvisories(v, seen);
              return [];
            });
          };
          for (const [name, item] of Object.entries(audit.vulnerabilities ?? {})) {
            const installed = Object.entries(lock.packages ?? {})
              .filter(([path]) => path === 'node_modules/' + name || path.endsWith('/node_modules/' + name))
              .map(([path, pkg]) => `${pkg.version} at ${path}`)
              .join('; ') || 'not found in lockfile';
            const titles = [...new Set(collectAdvisories(name))].join('; ') ||
              'No advisory object on this dependency node; follow its dependency chain in npm-audit.json';
            const fix = item.fixAvailable;
            const fixed = fix && typeof fix === 'object' ? `${fix.name ?? name}@${fix.version}` : fix === true ? 'npm audit fix candidate' : 'None reported';
            let classification = 'No fix available';
            if (fix && typeof fix === 'object' && fix.isSemVerMajor) classification = 'Requires breaking upgrade';
            else if (fix) classification = 'Safe upgrade';
            else if (!item.isDirect) classification = 'Transitive — needs upstream fix';
            rows.push({name, installed, title: titles, severity: item.severity, dependency: item.isDirect ? 'Direct' : 'Transitive', range: item.range ?? 'Not specified', fixed, classification});
          }
          const order = {critical:0, high:1, moderate:2, low:3};
          rows.sort((a,b) => order[a.severity]-order[b.severity] || a.name.localeCompare(b.name));
          const esc = value => String(value).replaceAll('|','\\|').replaceAll('\n',' ');
          const table = ['| Package | Installed version(s) and dependency path(s) | Vulnerability title / advisory | Severity | Dependency | Affected range | Fixed version / candidate | Classification |','|---|---|---|---|---|---|---|---|', ...rows.map(r => '| '+[r.name,r.installed,r.title,r.severity,r.dependency,r.range,r.fixed,r.classification].map(esc).join(' | ')+' |')].join('\n');
          const counts = audit.metadata?.vulnerabilities ?? {};
          const summary = '# Dependency security audit\n\nGenerated from the committed package-lock.json using npm audit --json. No dependencies were modified. The attached npm-audit.json is the complete raw npm report.\n\n' +
            '## Severity totals\n\n' + Object.entries(counts).map(([k,v]) => '- '+k+': '+v).join('\n') + '\n\n' +
            '## Vulnerability details\n\n' + (rows.length ? table : 'No known vulnerabilities reported by npm audit.') +
            '\n\n## Critical/high reachability review\n\n' +
            '- **Vitest / Tinypool (critical):** development/test-only dependencies. The application build does not ship them. The CI test command is `vitest run`; it does not start the vulnerable Vitest API/UI server. Not an end-user production attack path; CI/test supply-chain risk still warrants patching.\n' +
            '- **Vite (high):** development/build tooling. Production is a static GitHub Pages build; the Vite dev server is not deployed. The documented filesystem/dev-server paths are not production invoice-processing paths.\n' +
            '- **PostCSS (high):** build-time CSS processor. Inputs are repository-owned CSS/configuration, not invoice PDFs or user-supplied CSS. No runtime CSS processing path is exposed.\n' +
            '- **Playwright (high):** development/CI browser tooling. The vulnerable browser-download certificate path is relevant to CI supply-chain integrity, not the deployed app; upgrade the runner dependency.\n' +
            '- **source-map-js (high):** transitive build/test tooling. Source maps are generated from repository-owned source; no user-provided source maps are parsed by the app.\n' +
            '- **Zod (high):** runtime template-import validation. `parseTemplateImport` rejects payloads above 256 KB before JSON parsing; schemas cap templates at 100, field mappings at 20 and table columns at 8, with bounded text fields. This bounds the oversized-collection input implicated by the advisory. Keep the v3-to-v4 migration separate unless compatibility is proven.\n' +
            '\nExcelJS/uuid is a moderate transitive finding, not a critical/high finding. Review the UUID API usage separately before applying an override. npm audit itself cannot prove exploitability.\n';
          fs.writeFileSync('dependency-audit-report.md', summary);
          console.log(summary);
          NODE
          echo "npm audit completed with exit code ${audit_status}; report retained for review."
      - name: Upload full audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-audit
          path: |
            npm-audit.json
            dependency-audit-report.md
          if-no-files-found: error
          retention-days: 30
