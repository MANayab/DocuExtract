name: Format PDF.js regression tests
on:
  push:
    branches:
      - fix/pdfjs-standard-font-data

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Format changed test files
        run: npx prettier --write e2e/smoke.spec.ts src/tests/quality/benchmark.test.ts
      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/smoke.spec.ts src/tests/quality/benchmark.test.ts
          if git diff --cached --quiet; then
            echo "No formatting changes."
          else
            git commit -m "style(pdf): format PDF.js regression tests"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
