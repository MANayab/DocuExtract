name: Temporary PR 18 formatter output

on:
  push:
    branches:
      - feat/v1.6.0-offline-pwa

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Format the ESLint config
        run: npx prettier --write eslint.config.js
      - name: Collect formatted file
        run: |
          mkdir -p formatted
          cp eslint.config.js formatted/
      - uses: actions/upload-artifact@v4
        with:
          name: pr18-eslint-formatted
          path: formatted/
          retention-days: 1
