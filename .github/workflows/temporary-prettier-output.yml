name: Temporary pinned Prettier output
on:
  push:
    branches:
      - precommercial/v1.6.0-baseline
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: precommercial/v1.6.0-baseline
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Format with the repository-pinned Prettier
        run: npx prettier --write e2e/ocr-assets.spec.ts
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-prettier-ocr-e2e
          path: e2e/ocr-assets.spec.ts
          retention-days: 1
