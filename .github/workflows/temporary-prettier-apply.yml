name: Temporary pinned Prettier apply

on:
  push:
    branches:
      - precommercial/v1.6.0-baseline

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: precommercial/v1.6.0-baseline
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/tests/integration/parser.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tests/integration/parser.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format localized parser tests"
            git push origin HEAD:precommercial/v1.6.0-baseline
          fi
