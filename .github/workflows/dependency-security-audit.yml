name: Dependency security audit
on:
  push:
    branches:
      - chore/dependency-security-audit
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Non-mutating npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Generate complete dependency audit report
        shell: bash
        run: |
          set +e
          npm audit --json > npm-audit.json
          audit_status=$?
          set -e
          AUDIT_EXIT_CODE=$audit_status node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const audit = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const rows = [];
          const collectAdvisories = (name, seen = new Set()) => {
            if (seen.has(name)) return [];
            seen.add(name);
            const entry = audit.vulnerabilities?.[name];
            if (!entry) return [];
            return (entry.via ?? []).flatMap(v => {
              if (typeof v === 'object') return [`${v.title ?? v.name ?? 'Advisory title unavailable'} (${v.url ?? 'no advisory URL'})`];
              if (typeof v === 'string') return collectAdvisories(v, seen);
              return [];
            });
          };
          const dependsOnMinimatch = (name, seen = new Set()) => {
            if (seen.has(name)) return false;
            seen.add(name);
            const entry = audit.vulnerabilities?.[name];
            return (entry?.via ?? []).some(v =>
              typeof v === 'string'
                ? (v === 'minimatch' || dependsOnMinimatch(v, seen))
                : typeof v === 'object' && v.name === 'minimatch'
            );
          };
          const compareVersion = (left, right) => {
            const a = String(left).split('.').map(Number);
            const b = String(right).split('.').map(Number);
            for (let i = 0; i < 3; i++) {
              if ((a[i] ?? 0) !== (b[i] ?? 0)) return (a[i] ?? 0) - (b[i] ?? 0);
            }
            return 0;
          };
          for (const [name, item] of Object.entries(audit.vulnerabilities ?? {})) {
            const installedEntries = Object.entries(lock.packages ?? {})
              .filter(([path]) => path === 'node_modules/' + name || path.endsWith('/node_modules/' + name));
            const installed = installedEntries.map(([path, pkg]) => `${pkg.version} at ${path}`).join('; ') || 'not found in lockfile';
            const titles = [...new Set(collectAdvisories(name))].join('; ') ||
              'No advisory object on this dependency node; follow its dependency chain in npm-audit.json';
            const fix = item.fixAvailable;
            const fixedName = fix && typeof fix === 'object' ? (fix.name ?? name) : name;
            const fixedVersion = fix && typeof fix === 'object' ? fix.version : fix === true ? 'npm audit fix candidate' : 'None reported';
            const currentFixedPackage = lock.packages?.['node_modules/' + fixedName]?.version;
            let classification = 'No fix available';
            if (dependsOnMinimatch(name)) {
              classification = 'Transitive — needs upstream fix';
            } else if (fix && typeof fix === 'object' && currentFixedPackage && compareVersion(fixedVersion, currentFixedPackage) < 0) {
              classification = 'Transitive — needs upstream fix';
            } else if (fix && typeof fix === 'object' && fix.isSemVerMajor) {
              classification = 'Requires breaking upgrade';
            } else if (fix) {
              classification = 'Safe upgrade';
            } else if (!item.isDirect) {
              classification = 'Transitive — needs upstream fix';
            }
            rows.push({
              name, installed, title: titles, severity: item.severity,
              dependency: item.isDirect ? 'Direct' : 'Transitive',
              range: item.range ?? 'Not specified',
              fixed: fixedVersion === 'None reported' ? fixedVersion : `${fixedName}@${fixedVersion}`,
              classification,
            });
          }
          const order = {critical:0, high:1, moderate:2, low:3};
          rows.sort((a,b) => order[a.severity]-order[b.severity] || a.name.localeCompare(b.name));
          const esc = value => String(value).replaceAll('|','\\|').replaceAll('\n',' ');
          const table = ['| Package | Installed version(s) and dependency path(s) | Vulnerability title / advisory | Severity | Dependency | Affected range | Fixed version / candidate | Classification |','|---|---|---|---|---|---|---|---|', ...rows.map(r => '| '+[r.name,r.installed,r.title,r.severity,r.dependency,r.range,r.fixed,r.classification].map(esc).join(' | ')+' |')].join('\n');
          const counts = audit.metadata?.vulnerabilities ?? {};
          const reachability = {
            tinypool: 'Critical. Development/test-only worker pool. Worker options originate from repository-owned Vitest configuration and test code; no invoice/user input reaches this API. Not shipped in the production bundle.',
            vitest: 'Critical. Development/test-only runner. Project scripts use `vitest run`; the vulnerable API/UI server is not started. Not shipped in the production bundle. Keep test-runner upgrades on the security roadmap.',
            vite: 'High. Development/build tooling. The deployed GitHub Pages site is static and does not run the Vite dev server. Local developers may still expose a dev-server attack surface while running it; do not bind it publicly.',
            zod: 'High. Runtime dependency used for explicit local seller-template imports. The importer enforces a 256 KB input cap before JSON.parse; every array schema has an explicit maximum (100 templates, 20 field mappings, 8 table columns). No network endpoint accepts these payloads. The reported unbounded-array remote exhaustion path is not reachable; a malicious local file can still cause bounded validation work. Track Zod v4 migration separately.',
          };
          const criticalHigh = [...new Set(rows.filter(r => r.severity === 'critical' || r.severity === 'high').map(r => r.name))];
          const reachabilityTable = ['| Package | Production reachability / exposure assessment |','|---|---|',
            ...criticalHigh.map(name => '| '+name+' | '+(reachability[name] ?? 'Review the raw advisory and dependency path; no production exploit path has been established.')+' |')].join('\n');
          const summary = '# Dependency security audit\n\nThis non-mutating audit describes the dependency tree committed on this branch. The audit job itself does not modify package files. The attached `npm-audit.json` is the complete raw npm report.\n\n' +
            '## Severity totals\n\n' + Object.entries(counts).map(([k,v]) => '- '+k+': '+v).join('\n') + '\n\n' +
            '## Vulnerability details\n\n' + (rows.length ? table : 'No known vulnerabilities reported by npm audit.') +
            '\n\n## Safe upgrades applied in this PR\n\n' +
            '- ESLint 9.14.0 → 9.39.5; TypeScript-ESLint 8.13.0 → 8.72.1.\n' +
            '- Vite 5.4.10 → 5.4.21; Vitest and vite-node 2.1.5 → 2.1.9; @vitejs/plugin-react 4.3.3 → 4.7.0.\n' +
            '- Playwright and @playwright/test 1.48.2 → 1.64.1.\n' +
            '- PostCSS 8.4.47 → 8.5.32; postcss-selector-parser 6.1.4 → 6.1.5; source-map-js 1.2.1 → 1.2.2.\n' +
            '- Scoped ExcelJS uuid override 8.3.2 → 11.1.1; XLSX export/build/test verification passed.\n' +
            '\n## Critical/high reachability review\n\n' + (criticalHigh.length ? reachabilityTable : 'No critical or high findings.') +
            '\n\n## Remediation note\n\nSafe same-major or patched transitive updates are applied in the lockfile where compatible. Major upgrades are not forced. Remaining findings with major-only remediation are documented as such and require separate compatibility work.\n';
          fs.writeFileSync('dependency-audit-report.md', summary);
          console.log(summary);
          console.log('npm audit exit code:', process.env.AUDIT_EXIT_CODE);
          NODE
          echo "npm audit completed with exit code ${audit_status}; report retained for review."
      - name: Upload full audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-audit
          path: |
            npm-audit.json
            dependency-audit-report.md
          if-no-files-found: error
          retention-days: 30
