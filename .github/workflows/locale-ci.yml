name: Locale Parsing CI
on:
  push:
    branches: [feat/locale-aware-parsing]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: locale-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Typecheck, lint, changed-file format, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Format changed files on feature branch pushes
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/locale-aware-parsing'
        shell: bash
        run: |
          git fetch origin main --depth=1
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR origin/main...HEAD | grep -E '\.(astro|css|html|js|jsx|json|md|mdx|scss|ts|tsx|yaml|yml)$' || true)
          if [ "${#files[@]}" -gt 0 ]; then
            npx prettier --write "${files[@]}"
            git add -- "${files[@]}"
            if ! git diff --cached --quiet; then
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git commit -m 'style: format locale feature files'
              git push origin HEAD:feat/locale-aware-parsing
            fi
          fi
      - name: Check formatting of changed files only
        shell: bash
        run: |
          git fetch origin main --depth=1
          mapfile -t files < <(git diff --name-only --diff-filter=ACMR origin/main...HEAD | grep -E '\.(astro|css|html|js|jsx|json|md|mdx|scss|ts|tsx|yaml|yml)$' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo 'No changed files supported by Prettier.'
          else
            npx prettier --check "${files[@]}"
          fi
      - run: npm run test
      - run: npm run build
  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
