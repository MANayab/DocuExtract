name: One-time format release source
on:
  push:
    branches: [release/v1.5.0]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v1.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/components/templates/TemplateManager.tsx src/features/batch/batchStore.ts src/tests/unit/templateMatcher.test.ts src/tests/unit/templateSchema.test.ts
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/templates/TemplateManager.tsx src/features/batch/batchStore.ts src/tests/unit/templateMatcher.test.ts src/tests/unit/templateSchema.test.ts
          git commit -m "style: format seller template source"
          git push
