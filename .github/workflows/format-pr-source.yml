name: Format PR source

on:
  push:
    branches: [feat/v1.4.0-ocr-languages-2]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v1.4.0-ocr-languages-2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Apply Prettier to files already required by CI
        run: |
          npx prettier --write \
            e2e/locale-layout.spec.ts \
            e2e/ocr-assets.spec.ts \
            src/features/batch/batchStore.ts \
            src/features/ocr/ocrEngine.ts \
            src/features/pipeline/processPdf.ts \
            src/tests/integration/manualExportParity.test.ts \
            src/tests/unit/batchStore.test.ts \
            src/tests/unit/ocrEngine.test.ts \
            src/tests/unit/processPdf.test.ts
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add e2e/locale-layout.spec.ts e2e/ocr-assets.spec.ts src/features/batch/batchStore.ts src/features/ocr/ocrEngine.ts src/features/pipeline/processPdf.ts src/tests/integration/manualExportParity.test.ts src/tests/unit/batchStore.test.ts src/tests/unit/ocrEngine.test.ts src/tests/unit/processPdf.test.ts
          git commit -m "style: apply Prettier to OCR changes"
          git push
