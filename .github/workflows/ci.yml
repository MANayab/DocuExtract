name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check formatting for changed source and config files
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          git diff --name-only --diff-filter=ACMR "origin/${{ github.base_ref }}" "$GITHUB_SHA" -- "*.ts" "*.tsx" "*.js" "*.jsx" "*.json" "*.yml" "*.yaml" "*.css" "*.html" > /tmp/changed-files.txt
          if [ -s /tmp/changed-files.txt ]; then
            xargs -d '\n' npx prettier --check < /tmp/changed-files.txt
          else
            echo "No changed files to format-check."
          fi
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
  playwright:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
